description: >-
  First-party Wayflyer client packages, verified live against the npm registry.
  Wayflyer publishes its Embedded Finance (Hosted Capital) client SDKs under the
  @wf-financing npm scope (published via GitHub Actions) and its design-system
  packages under the @wayflyer scope (publisher wayflyer-eng). The v5 packages
  (@wf-financing/ui-sdk, @wf-financing/headless-sdk) are the current Embedded
  Journey v5 SDKs documented at docs.wayflyer.com; @wf-financing/ui and
  @wf-financing/headless are the v4-generation packages that remain published
  for the legacy hosted journey. No PyPI, Maven, NuGet, RubyGems, Packagist,
  crates.io, or pkg.go.dev first-party packages were found — the client surface
  is JavaScript/TypeScript only (the partner backend calls the REST API
  directly).
docs: https://docs.wayflyer.com/embedded-journey-v5-overview/using-the-sdk
