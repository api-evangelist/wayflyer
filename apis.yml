aid: wayflyer
name: Wayflyer
description: >-
  Wayflyer provides revenue-based financing and growth capital for e-commerce
  businesses, and exposes its funding products to software platforms through
  the Hosted Capital / Embedded Finance API. Partners upload anonymized
  merchant revenue data to generate personalised indicative offers, render a
  Wayflyer CTA banner in their own UI, and run the full funding application
  as an embedded (v5) or hosted (v4 legacy) journey — with JavaScript UI and
  headless SDKs on npm, a production-parity sandbox with application-state
  simulation, and OpenAPI 3.1 contracts published on a Kong Konnect developer
  portal at docs.wayflyer.com.
