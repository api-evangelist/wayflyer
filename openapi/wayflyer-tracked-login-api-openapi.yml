openapi: 3.2.0
info:
  title: Embedded Finance Sandbox Tracked Login API
  version: '1'
  description: ''
servers:
- url: https://sandbox-api.wayflyer.com/financing/
  description: Production
tags:
- name: Tracked Login
paths:
  /company/tracked-login/:
    post:
      operationId: wf_embedded_finance_service_apps_sandbox_views_tracked_login_create_tracked_login_token_view
      summary: Create a tracked login token
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedLoginTokenResponse'
      description: 'Generate a URL to redirect the user to log in to their Wayflyer account.


        Use this endpoint when you want to hand over a user with an existing Wayflyer account to Wayflyer.'
      tags:
      - Tracked Login
      security:
      - CompanyToken: []
components:
  schemas:
    TrackedLoginTokenResponse:
      properties:
        url:
          title: Url
          type: string
      required:
      - url
      title: TrackedLoginTokenResponse
      type: object
  parameters:
    ApiVersion:
      in: header
      name: API-Version
      schema:
        title: API-Version
        type: string
        enum:
        - '1'
      required: false
  securitySchemes:
    CompanyToken:
      type: http
      scheme: bearer
    PartnerToken:
      type: http
      scheme: bearer
