openapi: 3.2.0
info:
  title: Embedded Finance Sandbox Handover API
  version: '1'
  description: ''
servers:
- url: https://sandbox-api.wayflyer.com/financing/
  description: Production
tags:
- name: Handover
paths:
  /company/handover/:
    post:
      operationId: wf_embedded_finance_service_apps_sandbox_views_handover_handover
      summary: Hand over a user to Wayflyer
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverErrorResponse'
      description: 'Generate a URL to redirect the user to Wayflyer where they can continue their funding application.


        Requires the company to have an open hosted application.'
      tags:
      - Handover
      security:
      - CompanyToken: []
components:
  schemas:
    HandoverErrorResponse:
      properties:
        error_code:
          $ref: '#/components/schemas/HandoverErrorCode'
          description: Machine-readable error code
        detail:
          description: Human-readable error message
          title: Detail
          type: string
      required:
      - error_code
      - detail
      title: HandoverErrorResponse
      type: object
    HandoverResponse:
      properties:
        url:
          title: Url
          type: string
      required:
      - url
      title: HandoverResponse
      type: object
    HandoverErrorCode:
      enum:
      - company_not_bootstrapped
      - no_open_hosted_application
      - company_not_active
      title: HandoverErrorCode
      type: string
  parameters:
    ApiVersion:
      in: header
      name: API-Version
      schema:
        title: API-Version
        type: string
        enum:
        - '1'
      required: false
  securitySchemes:
    CompanyToken:
      type: http
      scheme: bearer
    PartnerToken:
      type: http
      scheme: bearer
